[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "x2power-simulator"
version = "0.1.0"
description = "Transparent feedstock-to-electricity simulation with explicit energy boundaries"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Julian Ascencio Vasquez"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "ty>=0.0.1", "build>=1.2"]

[project.scripts]
x2power = "x2power.cli:main"

[project.urls]
Repository = "https://github.com/julianascencio/x2power-simulator"
Documentation = "https://github.com/julianascencio/x2power-simulator/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/x2power"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["x2power"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
