name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,plots]'
      - run: pytest --cov=x2power --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,plots]'
      - run: ruff check .
      - run: ruff format --check .
      - run: ty check src use_cases analysis
      - run: python -m build
      - name: Verify wheel installation
        run: |
          python -m venv /tmp/x2power-wheel
          /tmp/x2power-wheel/bin/python -m pip install dist/*.whl
          /tmp/x2power-wheel/bin/x2power --version
          /tmp/x2power-wheel/bin/x2power run use_cases/scenarios/biogas_engine.json
          /tmp/x2power-wheel/bin/python -c "import importlib.util; assert importlib.util.find_spec('matplotlib') is None"
