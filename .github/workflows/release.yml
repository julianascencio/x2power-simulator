name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.pypi-initial-release']

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install validation tools
        run: python -m pip install -e '.[dev,plots]' twine
      - name: Verify release version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          import x2power

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert version == x2power.__version__, 'Package versions differ'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag/version mismatch'
          print(f'Validated x2power-simulator {version}')
          PY
      - run: ruff check .
      - run: ruff format --check .
      - run: ty check src use_cases analysis
      - run: pytest --cov=x2power --cov-report=term-missing
      - name: Build and check wheel and source distribution
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Verify clean wheel installation
        run: |
          python -m venv /tmp/x2power-release
          /tmp/x2power-release/bin/python -m pip install --no-deps dist/*.whl
          /tmp/x2power-release/bin/python -m pip check
          /tmp/x2power-release/bin/python -I -c "import importlib.metadata as m; import importlib.util; import x2power; assert x2power.__version__ == m.version('x2power-simulator'); assert importlib.util.find_spec('matplotlib') is None"
          /tmp/x2power-release/bin/x2power --version
          /tmp/x2power-release/bin/x2power run use_cases/scenarios/biogas_engine.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/x2power-simulator/
    steps:
      - name: Check publishing credential
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo '::error::Add the PYPI_API_TOKEN Actions secret for x2power-simulator, then rerun this job.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
